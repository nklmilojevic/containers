---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Exists
description: Return true or false if the app has a rolling tag on Quay.io

inputs:
  app:
    description: App Name
    required: true

outputs:
  exists:
    description: App Exists
    value: ${{ steps.app.outputs.exists }}

runs:
  using: composite
  steps:
    - name: App Exists
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      id: app
      env:
        APP: ${{ inputs.app }}
        OWNER: ${{ github.repository_owner }}
      with:
        script: |
          const { APP, OWNER } = process.env;
          const url = `https://quay.io/api/v1/repository/${OWNER}/${APP}/tag/?specificTag=rolling&onlyActiveTags=true`;

          const res = await fetch(url);
          // Quay answers 401 (not 404) for a repository that does not exist
          if ([401, 403, 404].includes(res.status)) {
              core.setOutput('exists', false);
              return;
          }
          if (!res.ok) {
              throw new Error(`Quay API returned ${res.status} for ${url}`);
          }

          const { tags } = await res.json();
          core.setOutput('exists', tags.length > 0);
