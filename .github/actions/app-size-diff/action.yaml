---
# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: App Size
description: Returns the uncompressed size of a published image and of a locally built image for one platform

inputs:
  from-image:
    description: Published baseline image (e.g. :rolling), pulled for the given platform
    required: true
  to-image:
    description: Locally built image to compare against the baseline
    required: true
  platform:
    description: Platform to compare (e.g. linux/amd64)
    required: true

outputs:
  previous:
    description: Size of the baseline image in bytes (0 when it does not exist yet)
    value: ${{ steps.size.outputs.previous }}
  current:
    description: Size of the locally built image in bytes
    value: ${{ steps.size.outputs.current }}

runs:
  using: composite
  steps:
    - name: App Size
      id: size
      shell: bash
      env:
        FROM_IMAGE: ${{ inputs.from-image }}
        TO_IMAGE: ${{ inputs.to-image }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        previous=0
        if docker pull --quiet --platform "$PLATFORM" "$FROM_IMAGE" > /dev/null; then
            previous=$(docker image inspect --format '{{ .Size }}' "$FROM_IMAGE")
        else
            echo "::notice::${FROM_IMAGE} not found for ${PLATFORM}, treating it as a new app"
        fi
        current=$(docker image inspect --format '{{ .Size }}' "$TO_IMAGE")
        {
            echo "previous=${previous}"
            echo "current=${current}"
        } >> "$GITHUB_OUTPUT"
